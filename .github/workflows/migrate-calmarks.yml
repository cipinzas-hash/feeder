name: Angst migrate calMarks

on:
  push:
    branches:
      - angst-architecture-0.0

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'move calMarks ownership to Planner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate calMarks ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/LegacyApp.jsx')
          text = path.read_text(encoding='utf-8')
          state_line = '  const [calMarks, setCalMarks] = useState({});'
          if state_line not in text:
              print('calMarks migration already applied or source changed; nothing to do')
              raise SystemExit(0)

          anchor = '  const weekOffset = plannerState.weekOffset ?? 0;\n'
          replacement = anchor + '''  const calMarks = plannerState.calMarks ?? {};\n  // Transitional adapter: existing Legacy handlers can keep calling\n  // setCalMarks(), but Planner is the authoritative owner.\n  const setCalMarks = (updater) => {\n    const current = calMarksRef.current || {};\n    const next = typeof updater === "function" ? updater(current) : updater;\n    plannerActions.setCalendarMarks(next);\n    calMarksRef.current = next;\n    return next;\n  };\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one Planner anchor')
          text = text.replace(anchor, replacement, 1)
          text = text.replace(state_line + '\n', '  // Planner 0.0 owns calMarks; Legacy accesses it through the adapter above.\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          grep -q 'const calMarks = plannerState.calMarks' core/LegacyApp.jsx
          ! grep -q 'const \[calMarks, setCalMarks\] = useState' core/LegacyApp.jsx
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/LegacyApp.jsx .github/workflows/migrate-calmarks.yml
          git rm .github/workflows/migrate-calmarks.yml
          git commit -m 'refactor: move calMarks ownership to Planner'
          git push
