name: Desplegar Worker angst-sync a Cloudflare

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-worker.yml'
      - '.github/scripts/deploy_worker.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Desplegar script + secrets + subdominio
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_GITHUB_PAT: ${{ secrets.WORKER_GITHUB_PAT }}
          WORKER_AUTH_SECRET: ${{ secrets.WORKER_AUTH_SECRET }}
        run: python3 .github/scripts/deploy_worker.py

      - name: Probar el Worker desplegado
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          AUTH_SECRET: ${{ secrets.WORKER_AUTH_SECRET }}
        run: |
          echo "Worker en: $WORKER_URL"
          if [ -z "$WORKER_URL" ]; then
            echo "::error::worker_url vino vacío del step anterior -- ver el log de 'Desplegar script' para la causa real"
            exit 1
          fi

          # El subdominio workers.dev recién creado puede tardar en tener
          # certificado SSL propagado (visto: exit 35 de curl, SSL_CONNECT_ERROR,
          # con apenas 15s de margen). Reintenta con backoff en vez de adivinar
          # un sleep fijo -- más robusto contra el tiempo real de propagación.
          ATTEMPT=0
          HTTP_NOAUTH=""
          while [ "$ATTEMPT" -lt 10 ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "$WORKER_URL" -d '{"payload":{}}' || echo "CURL_ERROR")
            echo "intento $ATTEMPT: HTTP $HTTP_NOAUTH"
            if [ "$HTTP_NOAUTH" = "401" ]; then break; fi
            sleep 10
          done

          RESP_NOAUTH=$(curl -s -w "\n%{http_code}" --max-time 10 -X POST "$WORKER_URL" -d '{"payload":{}}' || echo -e "\nCURL_ERROR")
          HTTP_NOAUTH=$(echo "$RESP_NOAUTH" | tail -1)
          BODY_NOAUTH=$(echo "$RESP_NOAUTH" | sed '$d')
          RESP_OK=$(curl -s -w "\n%{http_code}" --max-time 10 -X POST "$WORKER_URL" \
            -H "X-Angst-Auth: $AUTH_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"payload":{"_test":true,"deployedAt":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}}' || echo -e "\nCURL_ERROR")
          HTTP_OK=$(echo "$RESP_OK" | tail -1)
          BODY_OK=$(echo "$RESP_OK" | sed '$d')

          # GET: leer de vuelta lo que se acaba de escribir.
          RESP_GET=$(curl -s -w "\n%{http_code}" --max-time 10 -X GET "$WORKER_URL" -H "X-Angst-Auth: $AUTH_SECRET" || echo -e "\nCURL_ERROR")
          HTTP_GET=$(echo "$RESP_GET" | tail -1)
          BODY_GET=$(echo "$RESP_GET" | sed '$d')
          cat > /tmp/diag.json << DIAGEOF
          {
            "worker_url": "$WORKER_URL",
            "sin_auth": {"http": "$HTTP_NOAUTH", "body": $(echo "$BODY_NOAUTH" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")},
            "con_auth_post": {"http": "$HTTP_OK", "body": $(echo "$BODY_OK" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")},
            "con_auth_get": {"http": "$HTTP_GET", "body": $(echo "$BODY_GET" | python3 -c "import json,sys; print(json.dumps(sys.stdin.read()))")}
          }
          DIAGEOF
          cat /tmp/diag.json
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          cp /tmp/diag.json .worker-test-diag.json
          git add .worker-test-diag.json
          git commit -m "Worker: diagnóstico de la prueba de despliegue"
          for i in 1 2 3; do
            git push && break
            git fetch origin main && git reset --soft origin/main
            git commit -m "Worker: diagnóstico de la prueba de despliegue" || true
            sleep 5
          done
          if [ "$HTTP_NOAUTH" != "401" ] || [ "$HTTP_OK" != "200" ] || [ "$HTTP_GET" != "200" ]; then
            echo "::error::ver .worker-test-diag.json en el repo para el detalle"
            exit 1
          fi
