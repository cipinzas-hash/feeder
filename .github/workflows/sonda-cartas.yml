name: Sonda de cartas (tcgcsv)

# Solo lectura: busca unas cartas por nombre en todos los grupos de tcgcsv y escribe docs/sonda-cartas.md (qué productos existen y cómo se llaman).
on:
  workflow_dispatch:
    inputs:
      nombres:
        description: "Nombres separados por coma"
        required: false
        default: "toxtricity,absol"

concurrency:
  group: sonda-cartas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar
        run: NOMBRES="${{ github.event.inputs.nombres || 'toxtricity,absol' }}" node modules/feed/scripts/sonda-cartas.mjs
      - name: Commitear el informe
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/sonda-cartas.md
          git diff --staged --quiet || git commit -m "Sonda de cartas $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push && break; git fetch origin main; git reset --soft origin/main; git diff --staged --quiet || git commit -m "Sonda de cartas"; sleep 5; done
