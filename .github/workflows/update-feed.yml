name: Actualizar feed de Angst

on:
  schedule:
    - cron: '0 */4 * * *'   # cada 4 horas
  workflow_dispatch: {}      # botón "Run workflow" manual en la pestaña Actions

# Evita que una corrida manual se solape con la programada (o dos manuales
# seguidas): en vez de competir por el mismo push a main y terminar en
# failure/cancelled, la segunda espera en cola a que termine la primera.
concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # Melee tiene su propio presupuesto interno de 12 min
                          # (se corta solo y commitea lo parcial); esto es margen
                          # extra para el resto del pipeline (RSS, cine, git push)
                          # después de eso -- ver meleeDeadline en build-feed.mjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: modules/feed
        run: npm install

      - name: Bajar feeds y extraer texto completo
        working-directory: modules/feed
        env:
          STARTGG_API_KEY: ${{ secrets.STARTGG_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Commitear data/feed.json si cambió
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          # Diagnóstico temporal (borrar cuando se confirme por qué feed.json
          # no generaba commits desde el 20 de agosto pese a reportar
          # "success"): archivo chico, se commitea SIEMPRE, sin pasar por el
          # chequeo de diff de acá abajo -- si esto deja de actualizarse
          # también, el problema es que build-feed.mjs no corre/escribe de
          # verdad; si esto SÍ se actualiza pero feed.json no, el problema
          # está en el "git diff --staged --quiet" de abajo, no en el script.
          echo "{\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"feedJsonBytes\":$(wc -c < modules/feed/data/feed.json),\"feedJsonSha256\":\"$(sha256sum modules/feed/data/feed.json | cut -d' ' -f1)\"}" > modules/feed/data/.diag-last-run.json
          git add modules/feed/data/.diag-last-run.json
          git diff --staged --quiet -- modules/feed/data/.diag-last-run.json || { git commit -m "diag: last run $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          git add modules/feed/data/feed.json
          git diff --staged --quiet -- modules/feed/data/feed.json || { git commit -m "Actualizar feed $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          pushed=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            sleep 5
          done
          # Antes: si los 3 intentos fallaban, el loop terminaba sin marcar el
          # step como fallido -- el paso entero reportaba "success" aunque el
          # commit local nunca hubiera llegado al remoto. Así se pasaron 3+
          # días sin detectarlo (ver commit de diagnóstico anterior, 31ce17d).
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos -- nada llegó al remoto, ver conflicto/permisos más arriba"
            exit 1
          fi

  build-cine:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar y enriquecer cine (TMDb + OMDb + Jikan)
        working-directory: modules/feed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-cine.mjs

      - name: Commitear data/cine.json si cambió
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/feed/data/cine.json
          git diff --staged --quiet -- modules/feed/data/cine.json || { git commit -m "Actualizar cine $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          pushed=0
          for i in 1 2 3; do
            git pull --rebase origin main && git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            sleep 5
          done
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos -- nada llegó al remoto, ver conflicto/permisos más arriba"
            exit 1
          fi
