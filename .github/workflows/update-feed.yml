name: Actualizar feed de Angst

on:
  schedule:
    - cron: '0 */4 * * *'   # cada 4 horas
  workflow_dispatch: {}      # botón "Run workflow" manual en la pestaña Actions

# Evita que una corrida manual se solape con la programada (o dos manuales
# seguidas): en vez de competir por el mismo push a main y terminar en
# failure/cancelled, la segunda espera en cola a que termine la primera.
concurrency:
  group: feed-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35   # Melee tiene su propio presupuesto interno de 15 min
                          # (se corta solo y commitea lo parcial, ver
                          # meleeDeadline en build-feed.mjs); el resto del
                          # pipeline (setup, RSS general, cine, git push)
                          # suele rondar 3-5 min más. 25 quedaba demasiado
                          # ajustado contra ese peor caso combinado -- varias
                          # corridas post-torneo (muchos sets de Top 8/upsets
                          # buscando clip por clip, secuencial) pegaban justo
                          # en el techo y se cancelaban antes de llegar al
                          # commit/push (confirmado: 5 corridas "cancelled"
                          # entre el 26-29 ago, todas a ~25.3min exactos).
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar con la punta real de main
        run: git fetch origin main && git reset --hard origin/main
        # actions/checkout sin ref: explícito clona el SHA que disparó el
        # run, no la punta viva de main -- si otro job/corrida pusheó algo
        # en el medio, este job arranca desincronizado y el retry de push
        # de abajo puede codificar esa desincronización como si fuera un
        # cambio real. Mismo fix que en build-cine, ver comentario ahí.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: modules/feed
        run: npm install

      - name: Bajar feeds y extraer texto completo
        working-directory: modules/feed
        env:
          STARTGG_API_KEY: ${{ secrets.STARTGG_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Commitear data/feed.json si cambió
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          # Heartbeat de diagnóstico (ver 31ce17d/35efa0a, confirmó que el
          # push venía fallando en silencio): archivo chico con bytes/sha256
          # de feed.json, se commitea siempre junto con feed.json -- si esto
          # deja de aparecer en el historial, el problema volvió a ser que
          # el job ni siquiera llega a este paso, no el push en sí.
          echo "{\"generatedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"feedJsonBytes\":$(wc -c < modules/feed/data/feed.json),\"feedJsonSha256\":\"$(sha256sum modules/feed/data/feed.json | cut -d' ' -f1)\"}" > modules/feed/data/.diag-last-run.json
          git add modules/feed/data/.diag-last-run.json modules/feed/data/feed.json
          git diff --staged --quiet || { git commit -m "Actualizar feed $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          # Sin pull --rebase: no hay nada que integrar -- feed.json se
          # regenera entero cada corrida, no hay cambios locales que
          # mergear sobre una base vieja (causa real del push roto desde
          # ~20 ago: actions/checkout clona shallow por default, y rebasear
          # una historia truncada cuando el remoto avanzó mientras corría
          # el build fallaba con errores genéricos). En vez de eso: parado
          # en la punta remota actual + recommit encima. git reset --soft
          # conserva el commit como staged, no se pierde contenido.
          pushed=0
          for i in 1 2 3; do
            git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Actualizar feed $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos -- nada llegó al remoto, ver conflicto/permisos más arriba"
            exit 1
          fi

  build-cine:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar con la punta real de main
        run: git fetch origin main && git reset --hard origin/main
        # Crítico acá en particular: build-cine arranca después de que
        # build ya pusheó (needs: build), pero su checkout por default
        # clona el SHA que disparó el run -- no la punta viva de main. Sin
        # este paso, empieza desincronizado y el retry de push más abajo
        # puede pisar lo que build acaba de pushear (pasó de verdad:
        # 51ec2c6, 29 ago, revirtió feed.json+diag de build por esto).

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bajar y enriquecer cine (TMDb + OMDb + Jikan)
        working-directory: modules/feed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-cine.mjs

      - name: Commitear data/cine.json si cambió
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/feed/data/cine.json
          git diff --staged --quiet -- modules/feed/data/cine.json || { git commit -m "Actualizar cine $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          # Mismo fix que en el job build -- ver comentario ahí.
          pushed=0
          for i in 1 2 3; do
            git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Actualizar cine $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos -- nada llegó al remoto, ver conflicto/permisos más arriba"
            exit 1
          fi
