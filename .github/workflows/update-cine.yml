name: Actualizar cine de Angst

on:
  schedule:
    - cron: '0 2-23/4 * * *'   # cada 4hs, offset de 2hs respecto a
                               # update-feed.yml -- separado a propósito
                               # (9-sep-2026): antes era un job "build-cine"
                               # con needs:build dentro de update-feed.yml,
                               # así que un timeout/cancelación del feed
                               # general bloqueaba a Cine enteramente, pese
                               # a ser pipelines de contenido sin relación.
                               # Ahora corren en ventanas propias, ninguno
                               # puede bloquear al otro.
  workflow_dispatch: {}

concurrency:
  group: cine-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-cine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar con la punta real de main
        run: git fetch origin main && git reset --hard origin/main
        # actions/checkout sin ref: explícito clona el SHA que disparó el
        # run, no la punta viva de main -- si otro workflow pusheó algo en
        # el medio (feed, melee, podcasts, pokecripto), este job arranca
        # desincronizado y el retry de push de abajo puede codificar esa
        # desincronización como si fuera un cambio real.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        working-directory: modules/feed
        run: npm install

      - name: Bajar y enriquecer cine (TMDb + OMDb + Jikan)
        working-directory: modules/feed
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-cine.mjs

      - name: Commitear data/cine.json si cambió
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/feed/data/cine.json
          git diff --staged --quiet -- modules/feed/data/cine.json || { git commit -m "Actualizar cine $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          pushed=0
          for i in 1 2 3; do
            git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Actualizar cine $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos -- nada llegó al remoto, ver conflicto/permisos más arriba"
            exit 1
          fi
