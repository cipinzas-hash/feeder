name: Angst architecture

on:
  push:
    branches:
      - angst-architecture-0.0
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate module registry
        run: node tests/module-registry.mjs
      - name: Validate Planner domain
        run: node tests/planner-domain.mjs
