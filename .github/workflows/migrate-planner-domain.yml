name: Migrate Planner domain

on:
  push:
    branches:
      - angst-architecture-0.0

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'angst-architecture-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: angst-architecture-0.0

      - name: Extract Planner domain ownership from core/App.jsx
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('core/App.jsx')
          text = path.read_text(encoding='utf-8')
          marker = '// ANGST 0.0: Planner domain imported from modules/planner/domain.js.'

          if marker in text:
              print('Planner domain already extracted; nothing to do.')
              raise SystemExit(0)

          old_import = 'import { fmt, fmtFull, getHoliday, addDays } from "./dates.js";\n'
          new_import = old_import + 'import { BASE_DATE, DAY_NAMES, DEFAULT_COOKING_OPTS, DEFAULT_ASEO_OPTS, CYNICAL_SUBTITLES, STOIC_PHRASES, makeEmptyDay, isWithKids, fmtTime } from "../modules/planner/domain.js";\n'
          if old_import not in text:
              raise SystemExit('Expected dates import not found')
          text = text.replace(old_import, new_import, 1)

          blocks = [
              '''function makeEmptyDay() {\n  return { tasks:[], abasto:"", cookingMode:"", aseoMode:"", menu:"", summary:"", humors:[], humorCustom:[], compras:[], schedule:[] };\n}\n''',
              '''function isWithKids(dateKey, custody) {\n  if(!custody) return true;\n  if(custody.overrides && custody.overrides[dateKey] !== undefined) return custody.overrides[dateKey];\n  const base = new Date(custody.baseDate+"T12:00:00");\n  const day  = new Date(dateKey+"T12:00:00");\n  const diffWeeks = Math.floor((day - base) / (7*24*60*60*1000));\n  return diffWeeks % 2 === 0 ? (custody.withKids !== false) : !(custody.withKids !== false);\n}\n''',
              '''function fmtTime(dl) { if (!dl) return "--:--"; return `${String(dl.h).padStart(2,"0")}:${String(dl.m).padStart(2,"0")}`; }\n''',
              '''const BASE_DATE = new Date(2026, 1, 21);\nconst DAY_NAMES = ["Sábado","Domingo","Lunes","Martes","Miércoles","Jueves","Viernes"];\nconst DEFAULT_COOKING_OPTS = ["cocino hoy 🍳","sobras ♻️","pedir 🍔","ayuno 🌿","red de apoyo 🤝"];\nconst DEFAULT_ASEO_OPTS    = ["aseo básico 🧹","aseo profundo 🫧","mantenimiento 🧼","superficies 🪣","vivir en la mugre 💀"];\nconst STOIC_PHRASES = [\n  "el universo no tiene plan, pero tú tienes planilla.",\n  "disciplina: hacer lo que dijiste que ibas a hacer.",\n  "memento mori. pero primero anota las compras.",\n  "ama fati: quiere incluso los días sin tareas completadas.",\n  "lo que no se registra, no existió.",\n  "el estoico no se queja. el estoico presupuesta.",\n  "todo es temporal. el caos más que el orden.",\n  "no busques sentido. construye rutina.",\n  "la virtud está en el proceso, no en terminar la lista.",\n  "vivir bien es la mejor venganza contra el caos.",\n  "considera el obstáculo como el camino.",\n  "el tiempo es el único activo que no se recupera.",\n];\n\n// Exclusivo de Semana — antes vivía cerca del principio del archivo, sin\n// relación real con ningún módulo.\nconst CYNICAL_SUBTITLES = [\n  "otra semana de fingir que todo está bien",\n  "sobrevive. eso es suficiente.",\n  "el caos también puede tener horario",\n  "planificar no cura la existencia, pero ayuda",\n  "otra oportunidad de decepcionarte a ti mismo (o no)",\n  "la semana no se va a organizar sola, lamentablemente",\n  "no tienes que querer hacerlo para hacerlo",\n  "lo hiciste la semana pasada. puedes volver a hacerlo.",\n  "un día a la vez, aunque el día sea un desastre",\n  "el orden es temporal. el caos, permanente. organízate igual.",\n];\n'''
          ]

          for block in blocks:
              if block not in text:
                  raise SystemExit('Expected Planner-owned block not found; aborting without changes')
              text = text.replace(block, '', 1)

          text = text.replace('const { useState, useEffect, useRef, useMemo, useCallback } = React;', marker + '\nconst { useState, useEffect, useRef, useMemo, useCallback } = React;', 1)

          path.write_text(text, encoding='utf-8')
          print('Planner domain extraction completed.')
          PY

      - name: Validate architecture and build
        run: |
          npm run test:architecture
          npm run test:planner
          npm run build

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git config user.name 'angst-architecture-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add core/App.jsx
          git commit -m 'refactor: extract Planner domain from core'
          git push origin angst-architecture-0.0
