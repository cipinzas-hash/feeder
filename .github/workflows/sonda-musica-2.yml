name: Sonda 2 módulo de música

# Sonda 2 (22-oct-2026) del futuro módulo de descubrimiento musical.
# Solo se dispara a mano (botón "Run workflow"). No toca feed.json ni nada que
# lea la app: escribe modules/feed/data/sonda-musica-2.json y docs/sonda-musica-2.md.
# Se puede borrar sin consecuencias cuando termine la evaluación.

on:
  workflow_dispatch:

concurrency:
  group: sonda-musica-2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar con la punta real de main
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr la sonda
        working-directory: modules/feed
        # Timeout propio (21 min) para que, si se cuelga, SIGTERM haga que la
        # sonda guarde un reporte parcial antes del tope de 25 del job.
        run: |
          set -o pipefail
          timeout -s TERM -k 15 21m node scripts/sonda-musica-2.mjs 2>&1 | tee /tmp/sonda-musica-2.log

      - name: Commitear el reporte
        if: always()
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f modules/feed/data/sonda-musica-2.json docs/sonda-musica-2.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Sonda 2 música $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Sonda 2 música $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
