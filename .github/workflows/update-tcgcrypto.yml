name: Actualizar tcgcrypto

# Datos de tcgcrypto (issue #42): catálogo + precios por set y versión de Yu-Gi-Oh! y Digimon.
# Fuentes: tcgcsv.com (espejo de TCGplayer, sin key) y YGOPRODeck (solo clasificación). Corre una vez al día
# (tcgcsv se actualiza ~20:00 UTC) y a mano (Run workflow). No usa secrets.
# Escribe SOLO modules/feed/data/tcgcrypto-*.json.

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

concurrency:
  group: tcgcrypto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tcgcrypto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar con la punta real de main
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Construir datos de tcgcrypto
        run: |
          set -o pipefail
          timeout -s TERM -k 15 20m node modules/feed/scripts/build-tcgcrypto.mjs 2>&1 | tee /tmp/tcgcrypto.log

      - name: Commitear los datos
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add modules/feed/data/tcgcrypto-*.json
          git diff --staged --quiet || git commit -m "Actualizar tcgcrypto $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Actualizar tcgcrypto $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
