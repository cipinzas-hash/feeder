name: Angst migrate Planner collections

on:
  push:
    branches:
      - angst-architecture-0.0

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'move routines and recurring ownership to Planner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate routines and recurring ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/LegacyApp.jsx')
          text = path.read_text(encoding='utf-8')

          anchor = '  const custody = plannerState.custody ?? { baseDate: "2026-04-28", withKids: true, overrides: {} };\n'
          replacement = anchor + '''  const routines = plannerState.routines ?? [];\n  const recurring = plannerState.recurring ?? [];\n  // Transitional adapters: Legacy handlers continue to use their old names,\n  // but Planner owns the authoritative collections.\n  const setRoutines = (value) => {\n    plannerActions.setRoutines(value);\n    routinesRef.current = value;\n    return value;\n  };\n  const setRecurring = (value) => {\n    plannerActions.setRecurring(value);\n    recurringRef.current = value;\n    return value;\n  };\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one custody anchor')
          if 'const routines = plannerState.routines ?? [];' not in text:
              text = text.replace(anchor, replacement, 1)

          state_lines = [
              '  const [routines, setRoutines] = useState([]);\n',
              '  const [recurring, setRecurring] = useState([]);\n',
          ]
          for line, comment in zip(state_lines, [
              '  // Planner 0.0 owns routines; Legacy accesses them through the adapter above.\n',
              '  // Planner 0.0 owns recurring; Legacy accesses them through the adapter above.\n',
          ]):
              if line in text:
                  text = text.replace(line, comment, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          grep -q 'const routines = plannerState.routines' core/LegacyApp.jsx
          grep -q 'const recurring = plannerState.recurring' core/LegacyApp.jsx
          ! grep -q 'const \[routines, setRoutines\] = useState' core/LegacyApp.jsx
          ! grep -q 'const \[recurring, setRecurring\] = useState' core/LegacyApp.jsx
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+users.noreply.github.com'
          git add core/LegacyApp.jsx .github/workflows/migrate-routines-recurring.yml
          git rm .github/workflows/migrate-routines-recurring.yml
          git commit -m 'refactor: move routines and recurring ownership to Planner'
          git push
