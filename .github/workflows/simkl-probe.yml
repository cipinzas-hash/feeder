name: Simkl probe (diagnóstico, borrar luego)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: feeder
      - uses: actions/checkout@v4
        with:
          repository: cipinzas-hash/Angst-data
          token: ${{ secrets.WORKER_GITHUB_PAT }}
          path: angst-data
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        working-directory: feeder
        env:
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_PROBE_OUT: ${{ github.workspace }}/angst-data/simkl-probe.json
        run: node modules/feed/scripts/simkl-probe.mjs
      - name: Commit en Angst-data
        working-directory: angst-data
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add simkl-probe.json
          git commit -m "Simkl probe" && git push
