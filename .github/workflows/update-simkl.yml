name: Sincronizar Simkl

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6hs -- el estado de Simkl cambia mucho
                            # menos seguido que el feed general o Melee
  workflow_dispatch: {}

concurrency:
  group: simkl-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # subido de 10 a 15: la fase de 'bajo el radar'
                          # agrega hasta 20 enriquecimientos por corrida
                          # (cada uno, varias llamadas a TMDb/OMDb/Wikipedia)
    steps:
      - name: Checkout feeder (el script vive acá)
        uses: actions/checkout@v4
        with:
          path: feeder

      - name: Sincronizar feeder con la punta real de main
        working-directory: feeder
        run: git fetch origin main && git reset --hard origin/main

      - name: Checkout Angst-data (simkl-state.json vive acá, repo privado)
        uses: actions/checkout@v4
        with:
          repository: cipinzas-hash/Angst-data
          token: ${{ secrets.WORKER_GITHUB_PAT }}
          path: angst-data

      - name: Sincronizar Angst-data con la punta real de main
        working-directory: angst-data
        run: git fetch origin main && git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Correr build-simkl.mjs
        working-directory: feeder
        env:
          SIMKL_ACCESS_TOKEN: ${{ secrets.SIMKL_ACCESS_TOKEN }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_STATE_PATH: ${{ github.workspace }}/angst-data/simkl-state.json
          SIMKL_DISCOVERY_PATH: ${{ github.workspace }}/angst-data/simkl-discovery.json
          SIMKL_QUEUE_PATH: ${{ github.workspace }}/angst-data/simkl-queue.json
          SIMKL_VITRINA_PATH: ${{ github.workspace }}/angst-data/simkl-vitrina.json
          SERIES_CATALOG_DIR: ${{ github.workspace }}/angst-data/series-episodios
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node modules/feed/scripts/build-simkl.mjs

      - name: Commitear estado, discovery, avance y catálogo de series en Angst-data si cambiaron
        working-directory: angst-data
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          # simkl-queue.json NO se agrega: lo escribe solo el navegador (vía Worker).
          # Dos escritores sobre el mismo archivo hacían que el reintento de push
          # (reset --soft) pisara las marcas hechas mientras corría este job.
          git add simkl-state.json simkl-discovery.json simkl-vitrina.json
          [ -d series-episodios ] && git add series-episodios
          git rm -q -f --ignore-unmatch series-episodios.json   # formato anterior, un solo archivo de 3 MB
          git diff --staged --quiet || { git commit -m "Sincronizar Simkl $(date -u +%Y-%m-%dT%H:%MZ)"; committed=1; }
          pushed=0
          for i in 1 2 3; do
            git push && pushed=1 && break
            echo "push falló, reintentando ($i/3)..."
            git fetch origin main
            git reset --soft origin/main
            git diff --staged --quiet || git commit -m "Sincronizar Simkl $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          if [ "${committed:-0}" -eq 1 ] && [ "$pushed" -ne 1 ]; then
            echo "::error::se hizo commit local pero el push falló los 3 intentos"
            exit 1
          fi
