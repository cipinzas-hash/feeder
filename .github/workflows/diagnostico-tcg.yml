name: Diagnóstico API tcgpricelookup (manual)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pokecripto-update
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Correr diagnóstico
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: node modules/feed/scripts/diagnostico-tcg.mjs
      - name: Commitear resultado
        run: |
          git config user.name "angst-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/diag-tcg.json
          git commit -m "Diagnóstico API tcgpricelookup (issue #27)" || exit 0
          git pull --rebase origin main && git push
