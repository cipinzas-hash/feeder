name: Angst migrate dayData

on:
  push:
    branches:
      - angst-architecture-0.0

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, 'move dayData ownership to Planner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Migrate dayData ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/LegacyApp.jsx')
          text = path.read_text(encoding='utf-8')
          state_line = '  const [dayData, setDayData] = useState({});\n'
          if state_line not in text:
              print('dayData migration already applied or source changed; nothing to do')
              raise SystemExit(0)

          anchor = '  const { state: plannerState, actions: plannerActions } = usePlanner();\n'
          replacement = anchor + '''  const dayData = plannerState.dayData ?? {};\n  // Transitional adapter: Legacy keeps its historical setDayData API,\n  // but Planner owns the authoritative dayData object.\n  const setDayData = (updater) => {\n    const current = plannerState.dayData ?? {};\n    const next = typeof updater === "function" ? updater(current) : updater;\n    plannerActions.replaceDayData(next);\n    dayDataRef.current = next;\n    return next;\n  };\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected exactly one Planner anchor')
          text = text.replace(anchor, replacement, 1)
          text = text.replace(state_line, '  // Planner 0.0 owns dayData; Legacy accesses it through the adapter above.\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate migration
        run: |
          grep -q 'const dayData = plannerState.dayData' core/LegacyApp.jsx
          ! grep -q 'const \[dayData, setDayData\] = useState' core/LegacyApp.jsx
      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/LegacyApp.jsx .github/workflows/migrate-daydata.yml
          git rm .github/workflows/migrate-daydata.yml
          git commit -m 'refactor: move dayData ownership to Planner'
          git push
